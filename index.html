<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Cafe 北斗七星 ｜ 夜空と珈琲の読書室</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘルシーな星空の背景を演出するコンテナ -->
    <div class="night-sky">
        
        <!-- ヘッダー -->
        <header class="site-header">
            <p class="sub-title">Starlight Book Cafe</p>
            <h1>Cafe 北斗七星</h1>
            <p class="description">夜の静けさと、温かいお供と、心に残る物語を。</p>
        </header>

        <!-- メインコンテンツ（読書記録のカード） -->
        <main class="book-container">
            
            <!-- 読書カード 1冊目 -->
            <div class="book-card">
                <div class="star-rating">✨✨✨✨✨</div>
                <h2 class="book-title">『 ここに本のタイトル 』</h2>
                <p class="author">著者名 / 〇〇 著</p>
                <div class="pairing">☕ 今夜のお供：ホットミルクティー</div>
                <blockquote class="favorite-quote">
                    「心に残ったお気に入りのフレーズを、ここに優しく書き留めます。」
                </blockquote>
                <p class="memo">
                    読んだときの温かい余韻や、感じたことを自由に綴るスペースです。夜空の下でページをめくるような、穏やかな時間を記録。
                </p>
            </div>

        </main>

        <!-- フッター -->
        <footer class="site-footer">
            <p>&copy; 2026 Cafe 北斗七星</p>
        </footer>

    </div>

</body>
</html>
